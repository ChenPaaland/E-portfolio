<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thomas Casteran – Engineering Portfolio</title>
<meta name="description" content="E-portfolio of Thomas Casteran, engineering student at ENSEEIHT – Toulouse INP-N7.">
<meta property="og:title" content="Thomas Casteran – Engineering Portfolio">
<meta property="og:type" content="website">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<a class="skip" href="#welcome" data-i18n="skip"></a>
<div class="shell">
<aside class="side">
  <a class="brand" href="#welcome" id="brand"></a>
  <nav id="nav" aria-label="Main">
    <a href="#welcome" data-i18n="welcome"></a>
    <a href="#course" data-i18n="course"></a>
    <a href="#mobility" data-i18n="mobility"></a>
    <a href="#civic" data-i18n="civic"></a>
    <a href="#sport" data-i18n="sport"></a>
    <a href="#career" data-i18n="career"></a>
  </nav>
  <div class="side-foot">
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en">EN</button><button type="button" data-lang="fr">FR</button>
    </div>
    <p class="links" id="side-links"></p>
  </div>
</aside>
<main>
  <section id="welcome" class="hero">
    <h1 id="name"></h1>
    <p class="role" id="role"></p>
    <div class="hero-body">
      <div id="photo-wrap"></div>
      <div>
        <p class="pitch" id="pitch"></p>
        <p class="links" id="links"></p>
        <h2 class="small" data-i18n="interests"></h2>
        <ul class="tags" id="interests"></ul>
      </div>
    </div>
  </section>
  <section id="course"><h2 data-i18n="course"></h2><p class="lead" id="course-intro"></p><div id="course-projects"></div></section>
  <section id="mobility"><h2 data-i18n="mobility"></h2>
    <h3 class="sub" data-i18n="experiences"></h3><div id="mob-exp"></div>
    <h3 class="sub" data-i18n="plans"></h3><div id="mob-plans"></div></section>
  <section id="civic"><h2 data-i18n="civic"></h2><div id="civic-items"></div></section>
  <section id="sport"><h2 data-i18n="sport"></h2><div id="sport-items"></div></section>
  <section id="career"><h2 data-i18n="career"></h2>
    <h3 class="sub" data-i18n="internships"></h3><div id="career-exp"></div>
    <h3 class="sub" data-i18n="careerProject"></h3>
    <h4 data-i18n="cvs"></h4><p class="links" id="cv-links"></p>
    <iframe id="cv-preview" title="CV" loading="lazy"></iframe>
    <h4 data-i18n="linkedin"></h4><p class="links" id="li-links"></p>
    <div id="video-wrap"><h4 data-i18n="video"></h4><p class="muted" data-i18n="videoNote"></p>
      <div class="video"><iframe id="video" title="Elevator pitch" allowfullscreen loading="lazy"></iframe></div></div>
    <h4 data-i18n="roleModels"></h4><div class="cols" id="role-models"></div>
    <h4 data-i18n="mobAligned"></h4><div class="cols" id="career-mobility"></div>
  </section>
  <footer><p id="foot"></p></footer>
</main>
</div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
