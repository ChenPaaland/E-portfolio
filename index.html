.wrap{max-width:68rem;margin:auto}

.offset{position:absolute;left:0;top:0;width:75%;height:75%;background:var(--tint);border-radius:0 0 0 2.5rem}

.btn{display:inline-block;border:1.5px solid var(--line);border-radius:.6rem;padding:.55rem 1.2rem;font-weight:600;font-size:.95rem;text-decoration:none;color:var(--ink);background:var(--panel)}

.title{text-align:center;font-size:clamp(2rem,4.5vw,3rem);letter-spacing:-.03em;font-weight:800;line-height:1.1;margin:0 0 .6rem}
.sub{text-align:center;color:var(--muted);font-size:1.1rem;margin:0 0 3rem}.sub.tight{margin:-.25rem 0 1.5rem}
.h3{text-align:center;font-size:1.5rem;letter-spacing:-.02em;margin:3.5rem 0 1.5rem}
h4{margin:0 0 .5rem;font-size:1.15rem}
.grid2,.grid3{display:grid;gap:1.5rem}
.grid2{grid-template-columns:repeat(auto-fit,minmax(20rem,1fr))}.grid3{grid-template-columns:repeat(auto-fit,minmax(15rem,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:1rem;padding:1.5rem;overflow:hidden}
.card:has(.shot){padding:0}.pad{padding:1.5rem}

.item{padding-left:1.1rem;border-left:3px solid var(--accent)}.item p{margin:.4rem 0;color:var(--muted)}

.xpcard{max-width:46rem;margin:0 auto 1.5rem}
.xp{display:flex;gap:1.1rem}.xp>div:last-child{flex:1}
.xp-top{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.logo-img{width:3rem;height:3rem;border-radius:.7rem;object-fit:contain;flex:none;border:1px solid var(--line)}
.ph{display:grid;place-items:center;background:var(--tint);color:var(--accent);font-weight:800;font-size:1rem;border:0;border-radius:50%}
.org{color:var(--accent);font-weight:600;margin:.1rem 0 .5rem}
.avatar-sm{display:block;width:4.5rem;height:4.5rem;border-radius:50%;object-fit:cover;margin:0 auto .75rem}
.video{aspect-ratio:16/9;max-width:46rem;margin:auto}.video iframe{width:100%;height:100%;border:0;border-radius:1rem}
footer{padding:2.5rem 1rem;text-align:center;color:var(--muted);font-size:.9rem;border-top:1px solid var(--line)}

@media(max-width:62rem){

  render();
  const links = [...document.querySelectorAll("#nav a")];
  const io = new IntersectionObserver((es) => es.forEach((s) => s.isIntersecting &&
    links.forEach((l) => l.setAttribute("aria-current", String(l.hash === "#" + s.target.id)))), { rootMargin: "-40% 0px -55% 0px" });
  document.querySelectorAll("main section").forEach((s) => io.observe(s));
})();
</script>
</body>
</html>
